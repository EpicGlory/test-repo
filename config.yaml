luxury_realty_sites:
  - name: "Williams Luxury Homes"
    url: "https://williamsluxuryhomes.com"
    search_paths:
      - "/silverleaf-estate-homes-properties-sale/"
      - "/dc-ranch-luxury-homes-sale/"
      - "/desert-mountain-homes-sale/"
      - "/estancia-scottsdale-homes-sale/"
      - "/pinnacle-peak-luxury-homes-sale/"
      - "/paradise-valley-homes-sale/"
  - name: "RETSY"
    url: "https://retsy.com"
    search_paths:
      - "/scottsdale-az-homes-for-sale/"
      - "/paradise-valley-az-homes-for-sale/"
  - name: "Russ Lyon Sothebys"
    url: "https://www.russlyon.com"
    search_paths:
      - "/results-gallery/?searchtype=3&city=Scottsdale&minprice=5000000&status=active"
      - "/results-gallery/?searchtype=3&city=Paradise+Valley&minprice=5000000&status=active"
  - name: "ROCO Luxury Homes"
    url: "https://rocoluxuryhomes.com"
    search_paths:
      - "/scottsdale-homes-for-sale/"
      - "/paradise-valley-homes-for-sale/"
  - name: "Scottsdale Real Estate Team"
    url: "https://scottsdalerealestateteam.com"
    search_paths:
      - "/scottsdale-new-construction/"

listing_sites:
  - name: "Zillow"
    base_url: "https://www.zillow.com"
    search_urls:
      - "/scottsdale-az/new-construction/?searchQueryState=%7B%22price%22%3A%7B%22min%22%3A5000000%7D%7D"
      - "/paradise-valley-az/new-construction/?searchQueryState=%7B%22price%22%3A%7B%22min%22%3A5000000%7D%7D"
  - name: "Realtor.com"
    base_url: "https://www.realtor.com"
    search_urls:
      - "/realestateandhomes-search/Scottsdale_AZ/type-single-family-home/price-5000000-na/nc-hide/age-new"
      - "/realestateandhomes-search/Paradise-Valley_AZ/type-single-family-home/price-5000000-na/nc-hide/age-new"
  - name: "Redfin"
    base_url: "https://www.redfin.com"
    search_urls:
      - "/city/16192/AZ/Scottsdale/filter/min-price=5M,property-type=house,new-construction=true"
      - "/city/13810/AZ/Paradise-Valley/filter/min-price=5M,property-type=house,new-construction=true"

county_records:
  assessor_api: "https://mcassessor.maricopa.gov/api"
  permit_viewer: "https://apps.pnd.maricopa.gov/PermitViewer"
  accela_portal: "https://accela.maricopa.gov/CitizenAccessMCOSS"

scraping:
  delay_min: 2
  delay_max: 5
  max_retries: 3
  selenium_headless: true
  request_timeout: 30

output:
  directory: "output"
  filename_prefix: "luxury_homes_scottsdale_pv"
