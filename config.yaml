county_records:
  name: "Summit County UT"
  # Summit County Utah Assessor does not publish a documented public JSON API;
  # the scraper will fall back to the HTML search endpoint.
  assessor_api: ""
  assessor_search_url: "https://tax.summitcountyutah.gov/taxweb/search.jsp"
  # Summit County uses CitizenServe for online permit tracking / applications:
  permit_viewer: "https://www.citizenserve.com/Portal/PortalController?Action=showHomePage&ctzPagePrefix=Portal_&installationID=253"
  # Park City municipal building permits (separate jurisdiction inside Summit County):
  accela_portal: "https://parkcity-energovweb.tylerhost.net/apps/SelfService"

styles:
  - "Mountain Modern"
  - "Mountain Contemporary"
  - "Contemporary"
  - "Modern"
  - "Transitional"
  - "Rustic Modern"
  - "Alpine"
  - "Chalet"
  - "Log Home"
  - "Timber Frame"
  - "Craftsman"
  - "Farmhouse"
  - "Mid-Century Modern"
  - "Scandinavian"

scraping:
  delay_min: 2
  delay_max: 5
  max_retries: 3
  selenium_headless: true
  request_timeout: 30

output:
  directory: "output"
  filename_prefix: "luxury_homes_summit_county_ut"
